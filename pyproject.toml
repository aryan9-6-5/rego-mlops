[tool.poetry]
name = "rego-mlops"
version = "0.1.0"
description = "Continuous Regulatory Compliance Reasoning"
authors = ["AI <ai@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
z3-solver = "4.12.6.0"
fastapi = "0.142.2"
uvicorn = "0.29.0"
python-dotenv = "1.2.4"
neo4j = "5.28.7"
supabase = "2.32.0"
openai = "1.109.1"
pydantic = "2.13.5"
httpx = "0.27.2"


[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.4.0"
pytest-cov = "5.0.0"
black = "26.3.1"
ruff = "0.4.10"
bandit = "1.9.4"
pip-audit = "2.10.1"
mypy = "1.20.2"

[tool.poetry.group.ct]
optional = true

[tool.poetry.group.ct.dependencies]
mlflow = "3.15.0"
kaggle = "1.8.4"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src", "tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "supabase",
    "supabase.*",
    "dotenv",
    "neo4j",
    "neo4j.*",
    "z3",
    "z3.*",
    "mlflow",
    "mlflow.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
